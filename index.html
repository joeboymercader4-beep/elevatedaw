<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELEVATE</title>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
background: #0a0a0a; 
color: #e0e0e0; 
font-family: 'Courier New', monospace; 
overflow-x: hidden;
}

/* Welcome Entry Screen Overlay */
#welcome-screen {
position: fixed;
top: 0; left: 0;
width: 100vw; height: 100vh;
background: #0a0a0a;
z-index: 9999;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
gap: 20px;
transition: opacity 0.5s ease, visibility 0.5s ease;
}

.welcome-title {
color: crimson;
font-size: 2.5rem;
font-weight: bold;
letter-spacing: 4px;
text-shadow: 0 0 15px crimson;
text-align: center;
}

.welcome-btn {
background: rgba(10, 10, 10, 0.9);
border: 2px solid crimson;
color: crimson;
padding: 15px 35px;
font-family: inherit;
font-size: 1rem;
font-weight: bold;
letter-spacing: 2px;
cursor: pointer;
box-shadow: 0 0 15px rgba(220, 20, 60, 0.5);
border-radius: 8px;
transition: all 0.3s ease;
}

.welcome-btn:hover {
background: crimson;
color: #000;
box-shadow: 0 0 30px crimson;
transform: scale(1.05);
}

#bg-canvas {
position: fixed;
top: 0; left: 0;
width: 100vw; height: 100vh;
z-index: 1;
opacity: 0.35;
pointer-events: none;
}

/* Upper Right Admin Controls Dropdown */
.admin-wrapper {
position: fixed;
top: 15px;
right: 15px;
z-index: 200;
display: none;
}

.admin-main-btn {
background: rgba(10, 10, 10, 0.9);
border: 1px solid crimson;
color: crimson;
padding: 8px 14px;
font-family: inherit;
font-size: 0.75rem;
font-weight: bold;
cursor: pointer;
box-shadow: 0 0 12px rgba(220, 20, 60, 0.4);
border-radius: 6px;
}

.admin-main-btn:hover {
background: crimson;
color: #000;
}

.admin-dropdown-menu {
display: none;
position: absolute;
right: 0;
top: 40px;
background: rgba(10, 10, 10, 0.95);
border: 1px solid crimson;
border-radius: 6px;
padding: 10px;
width: 220px;
flex-direction: column;
gap: 8px;
box-shadow: 0 0 20px rgba(220, 20, 60, 0.6);
}

.admin-dropdown-menu.active {
display: flex;
}

.action-btn {
background: rgba(10, 10, 10, 0.9);
border: 1px solid crimson;
color: crimson;
padding: 8px 12px;
font-family: inherit;
font-size: 0.7rem;
font-weight: bold;
cursor: pointer;
text-align: left;
transition: all 0.2s ease;
width: 100%;
}

.action-btn:hover { background: crimson; color: #0a0a0a; box-shadow: 0 0 10px crimson; }
.action-btn.danger { border-color: #ff3333; color: #ff3333; }
.action-btn.danger:hover { background: #ff3333; color: #0a0a0a; }

/* Fixed Background Music Control Bar */
.bg-music-floating-bar {
position: fixed;
bottom: 15px;
left: 15px;
z-index: 300;
background: rgba(10, 10, 10, 0.85);
border: 1px solid crimson;
border-radius: 20px;
padding: 6px 14px;
display: flex;
align-items: center;
gap: 10px;
box-shadow: 0 0 12px rgba(220, 20, 60, 0.4);
}

.bg-music-floating-bar button {
background: transparent;
border: none;
color: crimson;
font-family: inherit;
font-size: 0.75rem;
font-weight: bold;
cursor: pointer;
}

.bg-music-floating-bar button:hover { color: #fff; }

/* Main Page Container */
.page-section {
display: flex;
flex-direction: column;
align-items: center;
justify-content: flex-start;
min-height: 100vh;
width: 100vw;
text-align: center;
z-index: 20;
position: relative;
padding: 40px 15px 40px;
}

/* Dynamic Customizable Banner Framing (Original) */
.team-top-banner {
width: 95%;
max-width: 850px;
height: 220px;
border: 1.5px dashed crimson;
border-radius: 8px;
background: rgba(10, 10, 10, 0.85);
box-shadow: 0 0 15px rgba(220, 20, 60, 0.3);
margin-bottom: 35px;
overflow: hidden;
display: flex;
justify-content: center;
align-items: center;
position: relative;
transition: all 0.3s ease;
}

.team-top-banner img {
width: 100%;
height: 100%;
object-fit: contain;
object-position: center;
display: block;
}

.banner-placeholder {
color: crimson;
font-size: 0.8rem;
font-weight: bold;
letter-spacing: 1px;
padding: 20px;
}

.banner-admin-btn {
position: absolute;
bottom: 10px;
right: 10px;
background: rgba(10, 10, 10, 0.85);
border: 1px solid crimson;
color: crimson;
font-family: inherit;
font-size: 0.65rem;
font-weight: bold;
padding: 5px 10px;
border-radius: 4px;
cursor: pointer;
display: none;
z-index: 30;
box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
transition: all 0.2s ease;
}

.banner-admin-btn:hover { background: crimson; color: #000; }
body.is-admin .banner-admin-btn { display: block !important; }
body.is-admin .card-admin-controls { display: flex !important; }
body.is-admin .gallery-admin-controls { display: flex !important; }

/* Hierarchical Tree Container */
.team-hierarchy {
display: flex;
flex-direction: column;
align-items: center;
gap: 35px;
width: 95%;
max-width: 950px;
position: relative;
}

.hierarchy-tier {
display: flex;
justify-content: center;
align-items: center;
gap: 25px;
flex-wrap: wrap;
width: 100%;
position: relative;
}

.hierarchy-tier:not(:last-child)::after {
content: '';
position: absolute;
bottom: -22px;
left: 50%;
transform: translateX(-50%);
width: 2px;
height: 20px;
background: crimson;
box-shadow: 0 0 8px crimson;
}

/* User Info Card Support for Background GIF */
.team-card {
background: rgba(10, 10, 10, 0.85);
background-size: 100% 100%;
background-position: center;
background-repeat: no-repeat;
border: 1px solid crimson;
border-radius: 8px;
padding: 15px;
width: 220px;
display: flex;
flex-direction: column;
align-items: center;
box-shadow: 0 0 12px rgba(220, 20, 60, 0.3);
position: relative;
transition: all 0.3s ease;
overflow: hidden;
}

.team-card::before {
content: '';
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
background: rgba(10, 10, 10, 0.75);
z-index: 1;
border-radius: 7px;
}

.team-card > * {
position: relative;
z-index: 2;
}

.team-card:hover {
transform: translateY(-4px);
box-shadow: 0 0 20px rgba(220, 20, 60, 0.7);
}

.hierarchy-tier[data-tier="1"] .team-card {
border-width: 2px;
box-shadow: 0 0 18px rgba(220, 20, 60, 0.6);
transform: scale(1.05);
}

.hierarchy-tier[data-tier="1"] .team-card:hover {
transform: scale(1.08) translateY(-4px);
}

.hierarchy-tier[data-tier="1"] .team-avatar {
width: 95px;
height: 95px;
}

.team-avatar {
width: 80px;
height: 80px;
border-radius: 50%;
border: 2px solid crimson;
object-fit: cover;
object-position: center;
margin-bottom: 10px;
box-shadow: 0 0 10px crimson;
background: #111;
cursor: pointer;
}

.team-name { font-weight: bold; font-size: 1rem; color: crimson; margin-bottom: 5px; text-shadow: 0 0 5px #000; }
.team-role { font-size: 0.7rem; color: #ccc; margin-bottom: 12px; text-shadow: 0 0 5px #000; }
.team-actions { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.team-socials { display: flex; justify-content: center; gap: 12px; margin-bottom: 4px; }

.social-icon-btn {
width: 36px;
height: 36px;
border-radius: var(--m-btn-radius, 50%);
border-width: 1px;
border-style: var(--m-btn-border-style, solid);
border-color: var(--m-btn-border-color, crimson);
background: var(--m-btn-bg, rgba(220, 20, 60, 0.1));
display: flex;
align-items: center;
justify-content: center;
transition: all 0.2s ease;
text-decoration: none;
box-shadow: 0 0 6px rgba(220, 20, 60, 0.3);
}

.social-icon-btn svg {
width: 18px;
height: 18px;
fill: var(--m-btn-color, crimson);
transition: fill 0.2s ease;
}

.social-icon-btn:hover {
background: var(--m-btn-hover-bg, crimson);
box-shadow: 0 0 12px var(--m-btn-hover-bg, crimson);
transform: scale(1.1);
}

.social-icon-btn:hover svg { fill: var(--m-btn-hover-color, #000); }

.card-admin-controls {
position: absolute;
top: 6px;
right: 8px;
display: none;
gap: 6px;
z-index: 10;
}

.card-admin-btn { background: rgba(0,0,0,0.6); border: none; color: #fff; font-size: 12px; cursor: pointer; padding: 2px 4px; border-radius: 3px; }
.card-admin-btn:hover { color: crimson; background: #000; }

/* GALLERY STYLES */
.gallery-section-title {
color: #e4e4e4;
margin: 50px 0 20px 0;
letter-spacing: 2px;
}

.gallery-toolbar {
display: none !important;
}

body.is-admin .gallery-toolbar {
display: flex !important;
gap: 10px;
margin-bottom: 25px;
flex-wrap: wrap;
justify-content: center;
}

.gallery-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
gap: 20px;
width: 95%;
max-width: 950px;
margin-bottom: 50px;
}

.gallery-card {
background: rgba(10, 10, 10, 0.85);
border: 1px solid crimson;
border-radius: 8px;
padding: 10px;
display: flex;
flex-direction: column;
align-items: center;
box-shadow: 0 0 12px rgba(220, 20, 60, 0.3);
position: relative;
transition: all 0.3s ease;
overflow: hidden;
}

.gallery-card:hover {
transform: translateY(-4px);
box-shadow: 0 0 20px rgba(220, 20, 60, 0.7);
}

.gallery-img {
width: 100%;
height: 160px;
object-fit: cover;
border-radius: 6px;
border: 1px solid crimson;
cursor: pointer;
background: #111;
}

.gallery-caption {
font-size: 0.8rem;
color: crimson;
font-weight: bold;
margin-top: 8px;
word-break: break-word;
}

.gallery-admin-controls {
position: absolute;
top: 15px;
right: 15px;
display: none;
gap: 5px;
z-index: 10;
}

/* Modals Setup */
#member-modal, #img-modal, #manager-modal, #banner-customize-modal, #btn-customize-modal, #bg-music-modal, #gallery-modal, #trash-modal {
position: fixed;
top: 0; left: 0;
width: 100vw; height: 100vh;
background: rgba(0, 0, 0, 0.85);
z-index: 1000;
display: none;
justify-content: center;
align-items: center;
}

.modal-content {
background: rgba(10, 10, 10, 0.95);
border: 1px solid crimson;
border-radius: 8px;
padding: 20px;
width: 90%;
max-width: 450px;
display: flex;
flex-direction: column;
gap: 10px;
box-shadow: 0 0 25px rgba(220, 20, 60, 0.5);
text-align: left;
max-height: 90vh;
overflow-y: auto;
}

.modal-content h3 { color: crimson; font-size: 0.9rem; text-align: center; }
.modal-content label { font-size: 0.65rem; color: #aaa; }
.modal-content input[type="text"], .modal-content input[type="file"], .modal-content select {
width: 100%;
background: #111;
border: 1px solid #444;
color: #fff;
padding: 6px;
font-family: inherit;
font-size: 0.7rem;
border-radius: 4px;
}

.color-input-group { display: flex; align-items: center; gap: 10px; }
.color-input-group input[type="color"] { background: transparent; border: 1px solid #444; width: 40px; height: 28px; cursor: pointer; border-radius: 4px; }

.avatar-preview-box {
width: 60px; height: 60px;
border-radius: 50%;
border: 1px solid crimson;
object-fit: cover;
margin: 0 auto;
display: block;
background: #111;
}

.card-bg-preview-box {
width: 100%;
height: 60px;
border: 1px solid crimson;
object-fit: cover;
border-radius: 4px;
background: #111;
display: block;
}

.manager-list { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.manager-item { display: flex; justify-content: space-between; align-items: center; background: #111; border: 1px solid #333; padding: 8px 10px; border-radius: 4px; font-size: 0.75rem; }
.manager-item-info { display: flex; flex-direction: column; overflow: hidden; max-width: 55%; }
.manager-item-title { color: crimson; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.manager-item-sub { color: #888; font-size: 0.65rem; }
.manager-item-actions { display: flex; gap: 4px; }

.sm-btn { padding: 4px 8px; font-size: 0.65rem; font-family: inherit; border: 1px solid crimson; background: transparent; color: crimson; cursor: pointer; border-radius: 3px; }
.sm-btn:hover { background: crimson; color: #000; }

#img-modal img { max-width: 85%; max-height: 85%; border: 2px solid crimson; box-shadow: 0 0 25px crimson; border-radius: 6px; object-fit: contain; }
</style>
</head>
<body>

<!-- Welcome Entry Overlay Screen -->
<div id="welcome-screen">
<div class="welcome-title">ELEVATE ANO TARA?</div>
<button class="welcome-btn" onclick="enterWebsite()">CLICK MO MUNA!</button>
</div>

<!-- Admin Dropdown Menu -->
<div class="admin-wrapper" id="admin-menu-wrapper">
<button class="admin-main-btn" onclick="toggleAdminMenu()">⚙ ADMIN MENU</button>
<div id="admin-dropdown" class="admin-dropdown-menu">
<button class="action-btn" onclick="openBannerCustomizeModal()">✏ CUSTOMIZE BANNER</button>
<button class="action-btn" onclick="openBtnCustomizeModal()">🎨 CUSTOMIZE MEMBER BUTTONS</button>
<button class="action-btn" onclick="openBgMusicModal()">🎵 SET BACKGROUND MUSIC</button>
<button class="action-btn" onclick="document.getElementById('top-banner-input').click()">+ SET BANNER IMAGE</button>
<button class="action-btn" onclick="setMemberPin()">🔑 SET MEMBER PIN</button>
<button class="action-btn" onclick="openMemberModal()">+ ADD MEMBER</button>
<button class="action-btn" onclick="openGalleryModal()">🖼 ADD GALLERY PHOTO</button>
<button class="action-btn" onclick="openTrashModal()">♻ RESTORE DELETED PHOTOS</button>
<button class="action-btn" onclick="openManagerModal()">⚙ MANAGE DATA</button>
<button class="action-btn" id="admin-audio-toggle-btn" onclick="toggleAudio()">⏸ PAUSE AUDIO</button>
<button class="action-btn danger" onclick="resetDatabase()">RESET ALL DATA</button>
<button class="action-btn danger" style="margin-top:5px; border-style:dashed;" onclick="logoutAdmin()">🔒 LOGOUT ADMIN</button>
</div>
</div>

<!-- Floating Audio Controller (Global BGM) -->
<div class="bg-music-floating-bar">
<button id="float-audio-btn" onclick="toggleAudio()">▶ BGM: PLAY</button>
</div>

<canvas id="bg-canvas"></canvas>

<input type="file" id="top-banner-input" accept="image/gif, image/png, image/jpeg, image/webp" style="display: none;" onchange="handleBannerUpload(this)">

<div class="page-section">
<div class="team-top-banner" id="banner-container">
<img id="top-banner-img" src=" " alt="Top Banner GIF" onerror="handleBannerFallback(this)">
<span id="banner-placeholder-text" class="banner-placeholder" style="display:none;">[ TOP BLANK IMAGE SLOT ]</span>
<button class="banner-admin-btn" onclick="openBannerCustomizeModal()">✏ EDIT BANNER</button>
</div>

<h2 style="color: rgb(228, 228, 228); margin-bottom: 25px;">TEAM</h2>
<div id="team-hierarchy" class="team-hierarchy"></div>

<!-- GALLERY SECTION -->
<h2 class="gallery-section-title">GALLERY</h2>
<div class="gallery-toolbar">
<button class="sm-btn" onclick="openGalleryModal()">+ ADD PICTURE</button>
<button class="sm-btn" onclick="openTrashModal()">♻ RESTORE DELETED</button>
</div>
<div id="gallery-grid" class="gallery-grid"></div>
</div>

<!-- Modals -->
<div id="bg-music-modal">
<div class="modal-content">
<h3>BACKGROUND MUSIC SETTINGS</h3>
<label>Audio URL (.mp3 / .ogg / .wav)</label>
<input type="text" id="bg-music-url" placeholder="assets/bg-music.mp3 o direct audio link">
<label>O mag-upload ng Local Audio File</label>
<input type="file" id="bg-music-file" accept="audio/*" onchange="handleLocalBgMusicUpload(this)">
<div style="display: flex; gap: 8px; margin-top: 10px;">
<button class="action-btn" style="flex:1; text-align:center;" onclick="saveBgMusicSettings()">SAVE MUSIC</button>
<button class="action-btn" style="flex:1; text-align:center;" onclick="closeBgMusicModal()">CANCEL</button>
</div>
</div>
</div>

<div id="banner-customize-modal">
<div class="modal-content">
<h3>CUSTOMIZE BANNER</h3>
<label>Upload New Banner Image / GIF</label>
<input type="file" accept="image/gif, image/png, image/jpeg, image/webp" onchange="handleBannerUpload(this)">
<label>Banner Height (px)</label>
<input type="text" id="b-height" placeholder="e.g. 220">
<label>Border Style</label>
<select id="b-border-style">
<option value="dashed">Dashed</option>
<option value="solid">Solid</option>
<option value="double">Double</option>
<option value="dotted">Dotted</option>
</select>
<label>Border & Glow Color</label>
<div class="color-input-group">
<input type="color" id="b-color-picker" value="#dc143c" onchange="document.getElementById('b-color-text').value = this.value">
<input type="text" id="b-color-text" placeholder="#dc143c" style="flex:1;">
</div>
<label>Glow Shadow Intensity (px)</label>
<input type="text" id="b-glow" placeholder="e.g. 15">
<label>Image Fit Style</label>
<select id="b-fit">
<option value="contain">Contain (Fit Whole Image)</option>
<option value="cover">Cover (Full Bleed)</option>
</select>
<div style="display: flex; gap: 8px; margin-top: 10px;">
<button class="action-btn" style="flex:1; text-align:center;" onclick="saveBannerCustomizations()">SAVE</button>
<button class="action-btn" style="flex:1; text-align:center;" onclick="closeBannerCustomizeModal()">CANCEL</button>
</div>
</div>
</div>

<div id="btn-customize-modal">
<div class="modal-content">
<h3>CUSTOMIZE MEMBER BUTTONS</h3>
<label>Background Color</label>
<div class="color-input-group">
<input type="color" id="mb-bg-picker" value="#dc143c" onchange="document.getElementById('mb-bg-text').value = this.value">
<input type="text" id="mb-bg-text" placeholder="rgba(220, 20, 60, 0.1)" style="flex:1;">
</div>
<label>Text / Icon Color</label>
<div class="color-input-group">
<input type="color" id="mb-text-picker" value="#dc143c" onchange="document.getElementById('mb-text-text').value = this.value">
<input type="text" id="mb-text-text" placeholder="#dc143c" style="flex:1;">
</div>
<label>Border Color</label>
<div class="color-input-group">
<input type="color" id="mb-border-picker" value="#dc143c" onchange="document.getElementById('mb-border-text').value = this.value">
<input type="text" id="mb-border-text" placeholder="#dc143c" style="flex:1;">
</div>
<label>Hover Background Color</label>
<div class="color-input-group">
<input type="color" id="mb-hbg-picker" value="#dc143c" onchange="document.getElementById('mb-hbg-text').value = this.value">
<input type="text" id="mb-hbg-text" placeholder="#dc143c" style="flex:1;">
</div>
<label>Hover Text Color</label>
<div class="color-input-group">
<input type="color" id="mb-htext-picker" value="#000000" onchange="document.getElementById('mb-htext-text').value = this.value">
<input type="text" id="mb-htext-text" placeholder="#000000" style="flex:1;">
</div>
<label>Border Style</label>
<select id="mb-border-style">
<option value="solid">Solid</option>
<option value="dashed">Dashed</option>
<option value="double">Double</option>
<option value="dotted">Dotted</option>
</select>
<label>Border Radius (px)</label>
<input type="text" id="mb-radius" placeholder="e.g. 4">
<div style="display: flex; gap: 8px; margin-top: 10px;">
<button class="action-btn" style="flex:1; text-align:center;" onclick="saveBtnCustomizations()">SAVE</button>
<button class="action-btn" style="flex:1; text-align:center;" onclick="closeBtnCustomizeModal()">CANCEL</button>
</div>
</div>
</div>

<div id="member-modal">
<div class="modal-content">
<h3 id="modal-title">ADD CREW MEMBER</h3>
<label>Profile Picture</label>
<input type="file" id="m-img-file" accept="image/gif, image/png, image/jpeg, image/webp" onchange="previewAvatar(this)">
<img id="avatar-preview" class="avatar-preview-box" src="" alt="Avatar Preview">

<label style="margin-top:5px; color:crimson; font-weight:bold;">User Info Card Background (GIF / Image)</label>
<input type="file" id="m-card-bg-file" accept="image/gif, image/png, image/jpeg, image/webp" onchange="previewCardBg(this)">
<img id="card-bg-preview" class="card-bg-preview-box" src="" alt="Card BG Preview" style="display:none;">
<button type="button" class="sm-btn" style="margin-top: 3px;" onclick="removeCardBg()">Clear Card GIF Background</button>

<label style="margin-top:5px;">Name</label>
<input type="text" id="m-name" placeholder="AKI">
<label>Role</label>
<input type="text" id="m-role" placeholder="Leader / player ">
<label>Instagram Profile URL</label>
<input type="text" id="m-ig" placeholder="https://instagram.com/yourusername">
<label>Facebook Profile URL</label>
<input type="text" id="m-fb" placeholder="https://facebook.com/yourprofile">
<div style="display: flex; gap: 8px; margin-top: 10px;">
<button class="action-btn" style="flex:1; text-align:center;" onclick="saveMember()">SAVE</button>
<button class="action-btn" style="flex:1; text-align:center;" onclick="closeMemberModal()">CANCEL</button>
</div>
</div>
</div>

<!-- GALLERY ADD/MODIFY MODAL -->
<div id="gallery-modal">
<div class="modal-content">
<h3 id="gallery-modal-title">ADD GALLERY PHOTO</h3>
<label>Select Picture</label>
<input type="file" id="g-img-file" accept="image/gif, image/png, image/jpeg, image/webp" onchange="previewGalleryImg(this)">
<img id="gallery-preview" class="card-bg-preview-box" src="" alt="Gallery Preview" style="display:none; height:100px;">
<label style="margin-top:5px;">Caption / Title</label>

function saveToDatabase() {
const fullPayload = {
teamMembers,
galleryItems,
galleryTrash,
memberAccessPin,
bannerStyleConfig,
memberBtnStyleConfig,
globalBgMusic,
customTopBanner
};
db.ref('cyberHubData').set(fullPayload);
}

// === REALTIME LISTEN FROM CLOUD (PC & MOBILE AUTO SYNC) ===
function listenToCloud() {
db.ref('cyberHubData').on('value', (snapshot) => {
const data = snapshot.val();
if (data) {
if (data.teamMembers) teamMembers = data.teamMembers;
if (data.galleryItems) galleryItems = data.galleryItems;
if (data.galleryTrash) galleryTrash = data.galleryTrash;
if (data.memberAccessPin) memberAccessPin = data.memberAccessPin;
if (data.bannerStyleConfig) bannerStyleConfig = data.bannerStyleConfig;
if (data.memberBtnStyleConfig) memberBtnStyleConfig = data.memberBtnStyleConfig;
if (data.globalBgMusic) globalBgMusic = data.globalBgMusic;
if (data.customTopBanner !== undefined) customTopBanner = data.customTopBanner;

renderTeam();
renderGallery();
loadSavedBanner();
applyMemberBtnStyles();

if (audio.src !== globalBgMusic) {
audio.src = globalBgMusic;
}

if (document.getElementById('manager-modal').style.display === 'flex') {
renderManagerLists();
}
if (document.getElementById('trash-modal').style.display === 'flex') {
renderTrashList();
}
}
});
}

if (!isAdminAuthorized) return;

galleryItems.push(item);
saveToDatabase();
}

function permanentlyDeleteTrash(trashIndex) {
if (!isAdminAuthorized) return;
if (confirm("Permanently remove this picture?")) {
galleryTrash.splice(trashIndex, 1);
saveToDatabase();
}
}

function renderGallery() {
const container = document.getElementById('gallery-grid');
if (!container) return;
container.innerHTML = '';

if (galleryItems.length === 0) {
container.innerHTML = `<div style="grid-column: 1/-1; color:#666; font-size:0.8rem;">Walang pictures sa gallery.</div>`;
return;
}

galleryItems.forEach((item, index) => {
const card = document.createElement('div');
card.className = 'gallery-card';
card.innerHTML = `
<div class="gallery-admin-controls">
<button class="card-admin-btn" onclick="openGalleryModal(${index})">✏ EDIT</button>
<button class="card-admin-btn" onclick="deleteGalleryItem(${index})">✖ DELETE</button>
</div>
<img src="${item.img}" alt="${item.caption}" class="gallery-img" onclick="openImgModal('${item.img}')">
<div class="gallery-caption">${item.caption}</div>
`;
container.appendChild(card);
});
}

function renderTrashList() {
const list = document.getElementById('trash-list');
list.innerHTML = '';
if (galleryTrash.length === 0) {
list.innerHTML = '<div style="color:#666; font-size:0.7rem; padding:5px;">No deleted pictures found.</div>';
return;
}

galleryTrash.forEach((item, index) => {
const div = document.createElement('div');
div.className = 'manager-item';
div.innerHTML = `
<div class="manager-item-info">
<span class="manager-item-title">${item.caption}</span>
</div>
<div class="manager-item-actions">
<button class="sm-btn" onclick="restoreGalleryItem(${index})">RESTORE</button>
<button class="sm-btn" onclick="permanentlyDeleteTrash(${index})">PERMANENT DELETE</button>
</div>
`;
list.appendChild(div);
});
}

const container = document.getElementById('team-hierarchy');
if (!container) return;
container.innerHTML = '';

const tier1 = teamMembers.filter(m => /leader|ceo|admin|owner|head/i.test(m.role));
const tier2 = teamMembers.filter(m => /co-leader|manager|core|developer|designer/i.test(m.role) && !tier1.includes(m));
const tier3 = teamMembers.filter(m => !tier1.includes(m) && !tier2.includes(m));

const tiers = [
{ level: 1, members: tier1.length ? tier1 : (teamMembers.length ? [teamMembers[0]] : []) },
{ level: 2, members: tier1.length ? tier2 : (teamMembers.length > 1 ? [teamMembers[1]] : []) },
{ level: 3, members: tier1.length ? tier3 : teamMembers.slice(2) }
];

tiers.forEach(tier => {
if (tier.members.length === 0) return;

const tierDiv = document.createElement('div');
tierDiv.className = 'hierarchy-tier';
tierDiv.setAttribute('data-tier', tier.level);

tier.members.forEach((member) => {
const globalIndex = teamMembers.indexOf(member);
const card = document.createElement('div');
card.className = 'team-card';

if (member.cardBg) {
card.style.backgroundImage = `url('${member.cardBg}')`;
}

let socialsHtml = '';
if (member.ig || member.fb) {
socialsHtml += `<div class="team-socials">`;
if (member.ig) socialsHtml += `<a href="${member.ig}" target="_blank" class="social-icon-btn">${igIcon}</a>`;
if (member.fb) socialsHtml += `<a href="${member.fb}" target="_blank" class="social-icon-btn">${fbIcon}</a>`;
socialsHtml += `</div>`;
}

card.innerHTML = `
<div class="card-admin-controls">
<button class="card-admin-btn" onclick="openMemberModal(${globalIndex})">✏</button>
<button class="card-admin-btn" onclick="deleteMember(${globalIndex})">✖</button>
</div>
<img src="${member.img}" alt="${member.name}" class="team-avatar" onclick="openImgModal('${member.img}')" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'80\\' height=\\'80\\'><rect width=\\'80\\' height=\\'80\\' fill=\\'%23111\\'/><text x=\\'50%\\' y=\\'50%\\' fill=\\'%23dc143c\\' font-size=\\'12\\' text-anchor=\\'middle\\' dy=\\'.3em\\'>NO IMG</text></svg>'">
<div class="team-name">${member.name}</div>
<div class="team-role">${member.role}</div>
<div class="team-actions">${socialsHtml}</div>
`;
tierDiv.appendChild(card);
});

container.appendChild(tierDiv);
});
}

function renderManagerLists() {
const list = document.getElementById('manager-team-list');
list.innerHTML = '';
if (teamMembers.length === 0) {
list.innerHTML = '<div style="color:#666; font-size:0.7rem; padding:5px;">No team members found.</div>';
return;
}

teamMembers.forEach((member, index) => {
const item = document.createElement('div');
item.className = 'manager-item';
item.innerHTML = `
<div class="manager-item-info">
<span class="manager-item-title">${member.name}</span>
<span class="manager-item-sub">${member.role}</span>
</div>
<div class="manager-item-actions">
<button class="sm-btn" onclick="openMemberModal(${index})">EDIT</button>
<button class="sm-btn" onclick="deleteMember(${index})">DELETE</button>
</div>
`;
list.appendChild(item);
});
}

// Background Matrix Canvas Animation
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%';
const fontSize = 12;
let columns = Math.floor(canvas.width / fontSize);
let drops = Array(columns).fill(1);

function drawCanvas() {
ctx.fillStyle = 'rgba(10, 10, 10, 0.08)';
ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.fillStyle = '#dc143c';
ctx.font = `${fontSize}px monospace`;

for (let i = 0; i < drops.length; i++) {
const text = chars.charAt(Math.floor(Math.random() * chars.length));
ctx.fillText(text, i * fontSize, drops[i] * fontSize);
if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
drops[i]++;
}
}
setInterval(drawCanvas, 33);

// Initialize Cloud Connection
listenToCloud();
checkAdminAccess();
</script>
</body>
</html>
