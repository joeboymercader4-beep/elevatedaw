#bg-canvas {

align-items: center;
justify-content: flex-start;

/* Dynamic Customizable Banner Framing */

}

.team-top-banner img {
width: 100%;
height: 100%;
object-fit: cover;
object-position: center;

}

.banner-placeholder {
color: crimson;
font-size: 0.8rem;

}

bottom: 10px;

font-size: 0.65rem;
font-weight: bold;
padding: 5px 10px;
border-radius: 4px;

display: none;

transition: all 0.2s ease;
}

}

body.is-admin .card-admin-controls { display: flex !important; }

.team-hierarchy {
display: flex;
flex-direction: column;
align-items: center;
gap: 35px;
width: 95%;
max-width: 950px;

}

/* Individual Hierarchy Tier Level */
.hierarchy-tier {
display: flex;
justify-content: center;
align-items: center;
gap: 25px;
flex-wrap: wrap;
width: 100%;
position: relative;
}

/* Vertical Connection Line Between Tiers */
.hierarchy-tier:not(:last-child)::after {
content: '';
position: absolute;
bottom: -22px;
left: 50%;
transform: translateX(-50%);
width: 2px;
height: 20px;
background: crimson;
box-shadow: 0 0 8px crimson;
}

.team-card {
background: rgba(10, 10, 10, 0.9);
border: 1px solid crimson;
border-radius: 8px;
padding: 15px;
width: 220px;
display: flex;
flex-direction: column;
align-items: center;
box-shadow: 0 0 12px rgba(220, 20, 60, 0.3);
position: relative;
transition: all 0.3s ease;
}

.team-card:hover {
transform: translateY(-4px);
box-shadow: 0 0 20px rgba(220, 20, 60, 0.7);
}

/* Leader Tier Highlights */
.hierarchy-tier[data-tier="1"] .team-card {
border-width: 2px;
box-shadow: 0 0 18px rgba(220, 20, 60, 0.6);

}

transform: scale(1.08) translateY(-4px);
}

}

cursor: pointer;

align-items: center;
justify-content: center;

box-shadow: 0 0 6px rgba(220, 20, 60, 0.3);
}

.social-icon-btn svg {
width: 18px;
height: 18px;

transition: fill 0.2s ease;
}

.social-icon-btn:hover {
background: var(--m-btn-hover-bg, crimson);

}

.social-icon-btn:hover svg { fill: var(--m-btn-hover-color, #000); }

.card-admin-controls {

right: 8px;

.sm-btn {

.sm-btn:hover { background: crimson; color: #000; }

#img-modal img {

max-height: 85%;

box-shadow: 0 0 25px crimson;

object-fit: contain;
}

/* Overlay Screen */
#overlay {
position: fixed;
top: 0; left: 0; 
width: 100vw; height: 100vh;
background: rgba(10, 10, 10, 0.95);

}
</style>
</head>

function startPage() {
const overlay = document.getElementById('overlay');
overlay.classList.add('glitch-out');
setTimeout(() => overlay.style.display = 'none', 350);
}

function saveToDatabase() {
localStorage.setItem('cyberHub_teamMembers', JSON.stringify(teamMembers));
localStorage.setItem('cyberHub_memberPin', memberAccessPin);
localStorage.setItem('cyberHub_bannerStyle', JSON.stringify(bannerStyleConfig));
localStorage.setItem('cyberHub_memberBtnStyle', JSON.stringify(memberBtnStyleConfig));
if (customTopBanner) {
    localStorage.setItem('cyberHub_topBanner', customTopBanner);
}
}

function applyMemberBtnStyles() {
if (memberBtnStyleConfig) {
    document.documentElement.style.setProperty('--m-btn-bg', memberBtnStyleConfig.bg || 'rgba(220, 20, 60, 0.1)');
    document.documentElement.style.setProperty('--m-btn-color', memberBtnStyleConfig.color || '#dc143c');
    document.documentElement.style.setProperty('--m-btn-border-color', memberBtnStyleConfig.borderColor || '#dc143c');
    document.documentElement.style.setProperty('--m-btn-hover-bg', memberBtnStyleConfig.hoverBg || '#dc143c');
    document.documentElement.style.setProperty('--m-btn-hover-color', memberBtnStyleConfig.hoverColor || '#000000');
    document.documentElement.style.setProperty('--m-btn-border-style', memberBtnStyleConfig.borderStyle || 'solid');
    document.documentElement.style.setProperty('--m-btn-radius', `${memberBtnStyleConfig.radius || 4}px`);
}
}

function applyBannerStyles() {
const container = document.getElementById('banner-container');
const img = document.getElementById('top-banner-img');

if (bannerStyleConfig) {
    container.style.height = `${bannerStyleConfig.height || 220}px`;
    container.style.borderStyle = bannerStyleConfig.borderStyle || 'dashed';
    container.style.borderColor = bannerStyleConfig.borderColor || 'crimson';
    container.style.boxShadow = `0 0 ${bannerStyleConfig.glow || 15}px ${bannerStyleConfig.borderColor || 'crimson'}`;
    img.style.objectFit = bannerStyleConfig.fit || 'cover';
}
}

function showBannerPlaceholder() {
document.getElementById('top-banner-img').style.display = 'none';
document.getElementById('banner-placeholder-text').style.display = 'block';
}

function handleBannerFallback(imgElement) {
imgElement.onerror = function() {
    showBannerPlaceholder();
};
}

function loadSavedBanner() {
applyBannerStyles();
if (customTopBanner) {
    const bannerImg = document.getElementById('top-banner-img');
    bannerImg.src = customTopBanner;
    bannerImg.style.display = 'block';
    document.getElementById('banner-placeholder-text').style.display = 'none';
}
}

function handleBannerUpload(input) {
if (!isAdminAuthorized) return;
const file = input.files[0];
if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
        customTopBanner = e.target.result;
        saveToDatabase();
        loadSavedBanner();
        input.value = "";
    };
    reader.readAsDataURL(file);
}
}

function openBannerCustomizeModal() {
if(!isAdminAuthorized) return;
document.getElementById('b-height').value = bannerStyleConfig.height || "220";
document.getElementById('b-border-style').value = bannerStyleConfig.borderStyle || "dashed";
document.getElementById('b-color-text').value = bannerStyleConfig.borderColor || "#dc143c";
document.getElementById('b-color-picker').value = bannerStyleConfig.borderColor || "#dc143c";
document.getElementById('b-glow').value = bannerStyleConfig.glow || "15";
document.getElementById('b-fit').value = bannerStyleConfig.fit || "cover";
document.getElementById('banner-customize-modal').style.display = 'flex';
}

function closeBannerCustomizeModal() {
document.getElementById('banner-customize-modal').style.display = 'none';
}

function saveBannerCustomizations() {
if (!isAdminAuthorized) return;

bannerStyleConfig = {
    height: document.getElementById('b-height').value.trim() || "220",
    borderStyle: document.getElementById('b-border-style').value,
    borderColor: document.getElementById('b-color-text').value.trim() || "crimson",
    glow: document.getElementById('b-glow').value.trim() || "15",
    fit: document.getElementById('b-fit').value
};

saveToDatabase();
applyBannerStyles();
closeBannerCustomizeModal();
}

function openBtnCustomizeModal() {
if(!isAdminAuthorized) return;
document.getElementById('mb-bg-text').value = memberBtnStyleConfig.bg || "rgba(220, 20, 60, 0.1)";
document.getElementById('mb-text-text').value = memberBtnStyleConfig.color || "#dc143c";
document.getElementById('mb-border-text').value = memberBtnStyleConfig.borderColor || "#dc143c";
document.getElementById('mb-hbg-text').value = memberBtnStyleConfig.hoverBg || "#dc143c";
document.getElementById('mb-htext-text').value = memberBtnStyleConfig.hoverColor || "#000000";
document.getElementById('mb-border-style').value = memberBtnStyleConfig.borderStyle || "solid";
document.getElementById('mb-radius').value = memberBtnStyleConfig.radius || "4";

document.getElementById('btn-customize-modal').style.display = 'flex';
}

function closeBtnCustomizeModal() {
document.getElementById('btn-customize-modal').style.display = 'none';
}

function saveBtnCustomizations() {
if (!isAdminAuthorized) return;

memberBtnStyleConfig = {
    bg: document.getElementById('mb-bg-text').value.trim() || "rgba(220, 20, 60, 0.1)",
    color: document.getElementById('mb-text-text').value.trim() || "#dc143c",
    borderColor: document.getElementById('mb-border-text').value.trim() || "#dc143c",
    hoverBg: document.getElementById('mb-hbg-text').value.trim() || "#dc143c",
    hoverColor: document.getElementById('mb-htext-text').value.trim() || "#000000",
    borderStyle: document.getElementById('mb-border-style').value,
    radius: document.getElementById('mb-radius').value.trim() || "4"
};

saveToDatabase();
applyMemberBtnStyles();
closeBtnCustomizeModal();
}

function toggleAdminMenu() {
const dropdown = document.getElementById('admin-dropdown');

if (!isAdminAuthorized) {
    const pinInput = prompt("ENTER ADMIN SECURITY PIN:");
    if (pinInput === ADMIN_PIN) {
        isAdminAuthorized = true;
        document.body.classList.add('is-admin');
        dropdown.classList.add('active');
        alert("Admin Granted.");
    } else if (pinInput !== null) {
        alert("ACCESS DENIED: Wrong PIN.");
    }
} else {
    dropdown.classList.toggle('active');
}
}

function setMemberPin() {
if (!isAdminAuthorized) return;
const newPin = prompt("Enter New Member Access Password/PIN:", memberAccessPin);
if (newPin !== null && newPin.trim() !== "") {
    memberAccessPin = newPin.trim();
    saveToDatabase();
    alert("Member Access PIN updated successfully!");
}
}

function logoutAdmin() {
isAdminAuthorized = false;
document.body.classList.remove('is-admin');
document.getElementById('admin-dropdown').classList.remove('active');
alert("Logged out of Admin Access.");
}

function resetDatabase() {
if (!isAdminAuthorized) return;
if (confirm("Are you sure you want to reset all stored data?")) {
    localStorage.removeItem('cyberHub_teamMembers');
    localStorage.removeItem('cyberHub_topBanner');
    localStorage.removeItem('cyberHub_memberPin');
    localStorage.removeItem('cyberHub_bannerStyle');
    localStorage.removeItem('cyberHub_memberBtnStyle');
    teamMembers = [];
    customTopBanner = "";
    memberAccessPin = "1234";
    bannerStyleConfig = { height: "220", borderStyle: "dashed", borderColor: "#dc143c", glow: "15", fit: "cover" };
    memberBtnStyleConfig = { bg: "rgba(220, 20, 60, 0.1)", color: "#dc143c", borderColor: "#dc143c", hoverBg: "#dc143c", hoverColor: "#000000", borderStyle: "solid", radius: "4" };
    saveToDatabase();
    renderTeam();
    applyBannerStyles();
    applyMemberBtnStyles();
    showBannerPlaceholder();
    if(document.getElementById('manager-modal').style.display === 'flex') {
        renderManagerLists();
    }
}
}

function previewAvatar(input) {
const file = input.files[0];
if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
        currentAvatarBase64 = e.target.result;
        document.getElementById('avatar-preview').src = currentAvatarBase64;
    };
    reader.readAsDataURL(file);
}
}

function openMemberModal(index = -1) { 
if(!isAdminAuthorized) return;
editMemberIndex = index;

if (index >= 0 && index < teamMembers.length) {
    const member = teamMembers[index];
    document.getElementById('modal-title').textContent = "EDIT CREW MEMBER";
    document.getElementById('m-name').value = member.name || '';
    document.getElementById('m-role').value = member.role || '';
    document.getElementById('m-ig').value = member.ig || '';
    document.getElementById('m-fb').value = member.fb || '';
    document.getElementById('m-music').value = member.music || '';
    currentAvatarBase64 = member.img || '';
    document.getElementById('avatar-preview').src = member.img || '';
} else {
    document.getElementById('modal-title').textContent = "ADD CREW MEMBER";
    document.getElementById('m-name').value = '';
    document.getElementById('m-role').value = '';
    document.getElementById('m-ig').value = '';
    document.getElementById('m-fb').value = '';
    document.getElementById('m-music').value = '';
    currentAvatarBase64 = "";
    document.getElementById('avatar-preview').src = "";
}

document.getElementById('m-img-file').value = '';
document.getElementById('member-modal').style.display = 'flex'; 
}

function closeMemberModal() { 
document.getElementById('member-modal').style.display = 'none'; 
currentAvatarBase64 = "";
editMemberIndex = -1;
document.getElementById('avatar-preview').src = "";
}

function openManagerModal() { 
if(!isAdminAuthorized) return;
renderManagerLists();
document.getElementById('manager-modal').style.display = 'flex'; 
}

function closeManagerModal() { document.getElementById('manager-modal').style.display = 'none'; }

function saveMember() {
if (!isAdminAuthorized) return;
const name = document.getElementById('m-name').value.trim();
const role = document.getElementById('m-role').value.trim() || 'Crew Member';
const img = currentAvatarBase64 || 'assets/default-avatar.png';
const ig = document.getElementById('m-ig').value.trim();
const fb = document.getElementById('m-fb').value.trim();
const music = document.getElementById('m-music').value.trim();

if (!name) {
    alert("Please enter a name.");
    return;
}

const memberData = { name, role, img, ig, fb, music };

if (editMemberIndex >= 0 && editMemberIndex < teamMembers.length) {
    teamMembers[editMemberIndex] = memberData;
} else {
    teamMembers.push(memberData);
}

saveToDatabase();
renderTeam();
closeMemberModal();
if(document.getElementById('manager-modal').style.display === 'flex') {
    renderManagerLists();
}
}

function deleteMember(index) {
if (!isAdminAuthorized) return;
if (confirm("Delete this team member?")) {
    teamMembers.splice(index, 1);
    saveToDatabase();
    renderTeam();
    if(document.getElementById('manager-modal').style.display === 'flex') {
        renderManagerLists();
    }
}
}

function playMemberMusic(musicUrl) {
if (!musicUrl) {
    alert("No music assigned to this member.");
    return;
}
audio.src = musicUrl;
audio.play().then(() => {
    document.getElementById('audio-toggle-btn').textContent = "⏸ PAUSE AUDIO";
}).catch(err => {
    alert("Unable to play audio. Verify the URL or file path.");
});
}

function toggleAudio() {
const btn = document.getElementById('audio-toggle-btn');
if (audio.paused) {
    audio.play();
    btn.textContent = "⏸ PAUSE AUDIO";
} else {
    audio.pause();
    btn.textContent = "▶ PLAY AUDIO";
}
}

function openImgModal(src) {
if (!src) return;
document.getElementById('modal-img').src = src;
document.getElementById('img-modal').style.display = 'flex';
}

function closeImgModal() {
document.getElementById('img-modal').style.display = 'none';
}

function renderTeam() {
const container = document.getElementById('team-hierarchy');
if (!container) return;
container.innerHTML = '';

// Filter members into hierarchy levels based on keywords in their role
const tier1 = teamMembers.filter(m => /leader|ceo|admin|owner|head/i.test(m.role));
const tier2 = teamMembers.filter(m => /co-leader|manager|core|developer|designer/i.test(m.role) && !tier1.includes(m));
const tier3 = teamMembers.filter(m => !tier1.includes(m) && !tier2.includes(m));

const tiers = [
    { level: 1, members: tier1.length ? tier1 : (teamMembers.length ? [teamMembers[0]] : []) },
    { level: 2, members: tier1.length ? tier2 : (teamMembers.length > 1 ? [teamMembers[1]] : []) },
    { level: 3, members: tier1.length ? tier3 : teamMembers.slice(2) }
];

tiers.forEach(tier => {
    if (tier.members.length === 0) return;

    const tierDiv = document.createElement('div');
    tierDiv.className = 'hierarchy-tier';
    tierDiv.setAttribute('data-tier', tier.level);

    tier.members.forEach((member) => {
        const globalIndex = teamMembers.indexOf(member);
        const card = document.createElement('div');
        card.className = 'team-card';

        let socialsHtml = '';
        if (member.ig || member.fb) {
            socialsHtml += `<div class="team-socials">`;
            if (member.ig) socialsHtml += `<a href="${member.ig}" target="_blank" class="social-icon-btn">${igIcon}</a>`;
            if (member.fb) socialsHtml += `<a href="${member.fb}" target="_blank" class="social-icon-btn">${fbIcon}</a>`;
            socialsHtml += `</div>`;
        }

        let musicBtnHtml = member.music 
            ? `<button class="team-btn" onclick="playMemberMusic('${member.music}')">🎵 PLAY THEME</button>` 
            : '';

        card.innerHTML = `
            <div class="card-admin-controls">
                <button class="card-admin-btn" onclick="openMemberModal(${globalIndex})">✏</button>
                <button class="card-admin-btn" onclick="deleteMember(${globalIndex})">✖</button>
            </div>
            <img src="${member.img}" alt="${member.name}" class="team-avatar" onclick="openImgModal('${member.img}')" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'80\\' height=\\'80\\'><rect width=\\'80\\' height=\\'80\\' fill=\\'%23111\\'/><text x=\\'50%\\' y=\\'50%\\' fill=\\'%23dc143c\\' font-size=\\'12\\' text-anchor=\\'middle\\' dy=\\'.3em\\'>NO IMG</text></svg>'">
            <div class="team-name">${member.name}</div>
            <div class="team-role">${member.role}</div>
            <div class="team-actions">
                ${socialsHtml}
                ${musicBtnHtml}
            </div>
        `;
        tierDiv.appendChild(card);
    });

    container.appendChild(tierDiv);
});
}

function renderManagerLists() {
const list = document.getElementById('manager-team-list');
list.innerHTML = '';

if (teamMembers.length === 0) {
    list.innerHTML = '<div style="color:#666; font-size:0.7rem; padding:5px;">No team members found.</div>';
    return;
}

teamMembers.forEach((member, index) => {
    const item = document.createElement('div');
    item.className = 'manager-item';
    item.innerHTML = `
        <div class="manager-item-info">
            <span class="manager-item-title">${member.name}</span>
            <span class="manager-item-sub">${member.role}</span>
        </div>
        <div class="manager-item-actions">
            <button class="sm-btn" onclick="openMemberModal(${index})">EDIT</button>
            <button class="sm-btn" onclick="deleteMember(${index})">DELETE</button>
        </div>
    `;
    list.appendChild(item);
});
}

// Background Matrix Canvas Animation
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%';
const fontSize = 12;
let columns = Math.floor(canvas.width / fontSize);
let drops = Array(columns).fill(1);

function drawCanvas() {
ctx.fillStyle = 'rgba(10, 10, 10, 0.08)';
ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.fillStyle = '#dc143c';
ctx.font = `${fontSize}px monospace`;

for (let i = 0; i < drops.length; i++) {
    const text = chars.charAt(Math.floor(Math.random() * chars.length));
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
    }
    drops[i]++;
}
}
setInterval(drawCanvas, 33);

// Initialize Page Data & Layout Settings
loadSavedBanner();
applyMemberBtnStyles();
renderTeam();
</script>
